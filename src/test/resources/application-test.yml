spring:
  datasource:
    url: jdbc:h2:mem:testcoldchain;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 测试环境关闭定时扫描的自动触发（首轮延迟/周期都拉长到 1 天）：
# 扫描由测试按确定节奏手工/直调触发，模拟“定时任务重启”即重复调用同一扫描入口
cold-chain:
  warning-scan:
    initial-delay-ms: 86400000
    fixed-delay-ms: 86400000
